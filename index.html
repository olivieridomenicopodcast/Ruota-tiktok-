<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Ruota</title>
<meta name="theme-color" content="#141225">
<link rel="manifest" href="./manifest.webmanifest" id="manifestLink">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141225;
  --panel:#1c1a33;
  --panel2:#242145;
  --ink:#f2eef9;
  --ink-dim:#a8a2c4;
  --line:#332f57;
  --accent:#ff5da2;
  --good:#4ade80;
  --bad:#fb7185;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 50% -10%, #241f45 0%, var(--bg) 55%);
  color:var(--ink);
  font-family:'Fredoka',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:48px;
}
.mono{font-family:'Space Mono',monospace;}
header{
  padding:22px 18px 10px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:1.7rem;
  font-weight:700;
  letter-spacing:0.3px;
}
header p{
  margin:6px 0 0;
  color:var(--ink-dim);
  font-size:0.85rem;
}
main{
  max-width:480px;
  margin:0 auto;
  padding:0 16px;
}
.wheel-zone{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:18px 0 14px;
}
.wheel-outer{
  position:relative;
  width:min(84vw, 320px);
  aspect-ratio:1/1;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,0.45));
}
.pointer{
  position:absolute;
  top:-6px;
  left:50%;
  transform:translateX(-50%);
  width:0; height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:22px solid #fff;
  z-index:5;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
#wheelSvg{
  width:100%; height:100%;
  display:block;
  transition:transform 3.1s cubic-bezier(0.12,0.72,0.14,1);
}
.hub{
  position:absolute;
  top:50%; left:50%;
  width:19%; height:19%;
  background:var(--panel);
  border:3px solid #fff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:4;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
}
.result-card{
  margin-top:14px;
  width:100%;
  min-height:34px;
  text-align:center;
}
.result-card .cat-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:999px;
  font-weight:600;
  font-size:0.95rem;
  color:#0b0a17;
}
.suggestion{
  margin-top:10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  font-size:0.9rem;
  display:none;
}
.suggestion.show{display:block;}
.suggestion .label{color:var(--ink-dim); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px;}
.suggestion .row{display:flex; gap:8px; margin-top:8px;}
.suggestion button{flex:1;}

.controls{
  display:flex;
  gap:8px;
  width:100%;
  margin-top:8px;
}
select{
  flex:1;
  background:var(--panel2);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 10px;
  font-family:'Fredoka',sans-serif;
  font-size:0.9rem;
}
button{
  font-family:'Fredoka',sans-serif;
  font-weight:600;
  border:none;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer;
  font-size:0.9rem;
  color:#0b0a17;
  background:var(--accent);
  transition:transform .08s ease;
}
button:active{transform:scale(0.96);}
button.ghost{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line);
}
button.small{padding:6px 10px; font-size:0.78rem;}
button.danger{background:var(--bad); color:#1a0a0d;}
button.ok{background:var(--good); color:#0a1a10;}
.spin-row{display:flex; gap:8px; margin-top:10px;}
.spin-row button{flex:1;}

section.block{
  margin-top:26px;
}
section.block > h2{
  font-size:1rem;
  margin:0 0 10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.badge{
  font-family:'Space Mono',monospace;
  font-size:0.72rem;
  color:var(--ink-dim);
  background:var(--panel2);
  padding:2px 8px;
  border-radius:999px;
}

.cat-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:12px;
}
.cat-head{
  display:flex;
  align-items:center;
  gap:10px;
}
.cat-dot{
  width:14px;height:14px;border-radius:50%;flex:0 0 auto;
}
.cat-head .name{
  font-weight:600;
  font-size:1rem;
  flex:1;
}
.cat-head .count{
  font-family:'Space Mono',monospace;
  font-size:0.78rem;
  color:var(--ink-dim);
}
.cat-head .iconbtn{
  background:transparent;
  border:none;
  color:var(--ink-dim);
  font-size:1rem;
  padding:4px 6px;
  cursor:pointer;
}
.cat-body{margin-top:10px;}
.story-list{list-style:none; margin:0; padding:0;}
.story-item{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:0.87rem;
}
.story-item:first-child{border-top:none;}
.story-item.used{opacity:0.42;}
.story-item.used .txt{text-decoration:line-through;}
.story-item .txt{flex:1; line-height:1.35;}
.story-item input[type=checkbox]{
  margin-top:2px;
  width:16px;height:16px;
  accent-color:var(--good);
}
.story-item .del{
  background:transparent;
  border:none;
  color:var(--bad);
  font-size:0.9rem;
  cursor:pointer;
  padding:2px 4px;
}
.add-story{
  display:flex;
  gap:6px;
  margin-top:8px;
}
.add-story input{
  flex:1;
  background:var(--panel2);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:10px;
  padding:8px 10px;
  font-family:'Fredoka',sans-serif;
  font-size:0.85rem;
}

.edit-form{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
  background:var(--panel2);
  border-radius:12px;
  padding:10px;
}
.edit-form input[type=text]{
  flex:1 1 100px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--ink);
  border-radius:8px;
  padding:7px 9px;
  font-family:'Fredoka',sans-serif;
  font-size:0.85rem;
}
.edit-form input[type=color]{
  width:38px; height:34px;
  border:none; border-radius:8px;
  background:none;
  padding:0;
}
.edit-form .row-actions{
  display:flex; gap:6px; width:100%;
  justify-content:flex-end;
}

.add-cat-card{
  border:1.5px dashed var(--line);
  border-radius:var(--radius);
  padding:14px;
  text-align:center;
}
.add-cat-card button{width:100%;}

.footer-bar{
  max-width:480px;
  margin:0 auto;
  padding:20px 16px 0;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.footer-bar button{flex:1; min-width:100px;}
.toast{
  position:fixed;
  bottom:20px; left:50%;
  transform:translateX(-50%);
  background:var(--panel2);
  color:var(--ink);
  padding:10px 18px;
  border-radius:999px;
  font-size:0.85rem;
  border:1px solid var(--line);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease;
  z-index:50;
}
.toast.show{opacity:1;}
input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <h1>🎡 La Ruota</h1>
  <p>Boardgame · Videogiochi · Radio · Musica · Podcast · Webapp AI — modificabile a piacere</p>
</header>

<main>

  <div class="wheel-zone">
    <div class="wheel-outer">
      <div class="pointer"></div>
      <svg id="wheelSvg" viewBox="0 0 300 300"></svg>
      <div class="hub">🎡</div>
    </div>

    <div class="result-card" id="resultCard"></div>

    <div class="controls">
      <select id="targetSelect"></select>
    </div>
    <div class="spin-row">
      <button id="spinTargetBtn">▶ GIRA (esce questa)</button>
      <button id="spinRandomBtn" class="ghost">🎲 Casuale</button>
    </div>

    <div class="suggestion" id="suggestionBox">
      <div class="label">Storia suggerita dalla riserva</div>
      <div id="suggestionText"></div>
      <div class="row">
        <button class="ok small" id="markUsedBtn">✓ Segna usata</button>
        <button class="ghost small" id="skipSuggestionBtn">Salta →</button>
      </div>
    </div>
  </div>

  <section class="block">
    <h2>Categorie e riserva storie <span class="badge" id="totalBadge"></span></h2>
    <div id="catList"></div>
    <div class="add-cat-card">
      <button id="addCatBtn" class="ghost">+ Nuova categoria</button>
    </div>
  </section>

</main>

<div class="footer-bar">
  <button class="ghost small" id="exportBtn">⬇ Esporta JSON</button>
  <button class="ghost small" id="importBtn">⬆ Importa JSON</button>
  <button class="ghost small" id="resetBtn">↺ Reset dati</button>
</div>
<input type="file" id="importFile" accept="application/json">

<div class="toast" id="toast"></div>

<script>
/* ---------- dati ---------- */
const DB_KEY = 'ruota_db';
const SEED = {
  v:1,
  categories:[
    {id:'boardgame', name:'Boardgame', emoji:'🎲', color:'#f5a623', uscite:0,
      stories:[
        {id:cid(), text:'Ho realizzato un gioco da tavolo (Arena Extinctio).', used:false},
        {id:cid(), text:'Top 5 giochi da tavolo preferiti.', used:false}
      ]},
    {id:'videogiochi', name:'Videogiochi', emoji:'🕹️', color:'#22d3ee', uscite:0,
      stories:[
        {id:cid(), text:'Ho realizzato un mini puzzle game (Godot) — hook: "non so programmare".', used:false}
      ]},
    {id:'radio', name:'Radio', emoji:'📡', color:'#4ade80', uscite:0,
      stories:[
        {id:cid(), text:'Ho parlato con un tizio in Inghilterra grazie a una canna da pesca sul terrazzo.', used:false},
        {id:cid(), text:'The Buzzer (UVB-76, la stazione russa misteriosa).', used:false},
        {id:cid(), text:'Sto completando il Pokédex, ma i Pokémon sono le nazioni — FT8 e logbook.', used:false}
      ]},
    {id:'musica', name:'Musica', emoji:'🎸', color:'#e879f9', uscite:0,
      stories:[
        {id:cid(), text:'Ho scritto un album sui problemi tecnici (TheMACSrPOO).', used:false},
        {id:cid(), text:'Nel 2012 suonavo in un gruppo metalcore, "Longosutiktok".', used:false}
      ]},
    {id:'podcast', name:'Podcast', emoji:'🎙️', color:'#fb7185', uscite:0,
      stories:[
        {id:cid(), text:'Ho editato un podcast con Pietro Morello e Barbascura X.', used:false}
      ]},
    {id:'webapp-ai', name:'Webapp AI', emoji:'💻', color:'#818cf8', uscite:0,
      stories:[
        {id:cid(), text:'Ho realizzato una webapp dove faccio giocare Claude, Gemini e ChatGPT a un gioco di ruolo.', used:false}
      ]}
  ]
};
function cid(){ return Math.random().toString(36).slice(2,9); }

let DB = load();
function load(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- wheel geometry ---------- */
let rotation = 0;
function polar(cx,cy,r,angleDeg){
  const a = (angleDeg-90) * Math.PI/180;
  return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
}
function sliceCategoryPath(cx,cy,r,startDeg,endDeg){
  const s = polar(cx,cy,r,startDeg);
  const e = polar(cx,cy,r,endDeg);
  const large = (endDeg-startDeg) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} Z`;
}
function renderWheel(){
  const svg = document.getElementById('wheelSvg');
  const n = DB.categories.length;
  svg.innerHTML = '';
  if(n === 0){
    return;
  }
  const seg = 360/n;
  const cx=150, cy=150, r=142;
  DB.categories.forEach((cat,i)=>{
    const start = i*seg, end = (i+1)*seg, mid = start+seg/2;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', sliceCategoryPath(cx,cy,r,start,end));
    path.setAttribute('fill', cat.color);
    path.setAttribute('stroke', '#141225');
    path.setAttribute('stroke-width','2');
    svg.appendChild(path);

    const lp = polar(cx,cy,r*0.62,mid);
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', lp.x);
    text.setAttribute('y', lp.y);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('dominant-baseline','middle');
    text.setAttribute('font-size', n > 8 ? '9' : '11');
    text.setAttribute('font-family',"'Fredoka', sans-serif");
    text.setAttribute('font-weight','600');
    text.setAttribute('fill', pickTextColor(cat.color));
    text.setAttribute('transform', `rotate(${mid}, ${lp.x}, ${lp.y})`);
    text.textContent = cat.emoji + ' ' + cat.name;
    svg.appendChild(text);
  });
  svg.style.transform = `rotate(${rotation}deg)`;
}
function pickTextColor(hex){
  const c = hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum > 0.6 ? '#141225' : '#ffffff';
}

/* ---------- spin ---------- */
function spinToIndex(idx, isRandomLabel){
  const n = DB.categories.length;
  if(n===0) return;
  const seg = 360/n;
  const mid = idx*seg + seg/2;
  const normalizedCurrent = ((rotation % 360)+360)%360;
  const targetOffset = ((360 - mid) - normalizedCurrent + 360) % 360;
  const extraTurns = 5*360;
  rotation += extraTurns + targetOffset;
  document.getElementById('wheelSvg').style.transform = `rotate(${rotation}deg)`;
  setTimeout(()=>{
    landOn(idx, isRandomLabel);
  }, 3150);
}
function landOn(idx, isRandomLabel){
  const cat = DB.categories[idx];
  const card = document.getElementById('resultCard');
  card.innerHTML = `<span class="cat-pill" style="background:${cat.color}">${cat.emoji} ${cat.name}${isRandomLabel ? ' (casuale)' : ''}</span>`;
  showSuggestion(cat.id);
}

document.getElementById('spinTargetBtn').addEventListener('click', ()=>{
  const sel = document.getElementById('targetSelect');
  const idx = DB.categories.findIndex(c=>c.id===sel.value);
  if(idx<0) return;
  spinToIndex(idx, false);
});
document.getElementById('spinRandomBtn').addEventListener('click', ()=>{
  const idx = Math.floor(Math.random()*DB.categories.length);
  spinToIndex(idx, true);
});

/* ---------- suggerimento storia ---------- */
let suggestionState = {catId:null, storyId:null};
function showSuggestion(catId){
  const cat = DB.categories.find(c=>c.id===catId);
  const box = document.getElementById('suggestionBox');
  const txt = document.getElementById('suggestionText');
  const next = cat.stories.find(s=>!s.used);
  if(!next){
    box.classList.add('show');
    txt.textContent = 'Riserva vuota per questa categoria — aggiungine una qui sotto.';
    suggestionState = {catId:null, storyId:null};
    return;
  }
  box.classList.add('show');
  txt.textContent = next.text;
  suggestionState = {catId:cat.id, storyId:next.id};
}
document.getElementById('markUsedBtn').addEventListener('click', ()=>{
  if(!suggestionState.storyId) return;
  const cat = DB.categories.find(c=>c.id===suggestionState.catId);
  const story = cat.stories.find(s=>s.id===suggestionState.storyId);
  story.used = true;
  cat.uscite = (cat.uscite||0)+1;
  save();
  renderCategories();
  toast('Segnata come usata ✓');
  showSuggestion(cat.id);
});
document.getElementById('skipSuggestionBtn').addEventListener('click', ()=>{
  if(!suggestionState.catId) return;
  const cat = DB.categories.find(c=>c.id===suggestionState.catId);
  const list = cat.stories.filter(s=>!s.used);
  const curIdx = list.findIndex(s=>s.id===suggestionState.storyId);
  const next = list[(curIdx+1)%list.length];
  if(next){
    suggestionState.storyId = next.id;
    document.getElementById('suggestionText').textContent = next.text;
  }
});

/* ---------- select ---------- */
function renderSelect(){
  const sel = document.getElementById('targetSelect');
  const prev = sel.value;
  sel.innerHTML = '';
  DB.categories.forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat.id;
    opt.textContent = `${cat.emoji} ${cat.name}`;
    sel.appendChild(opt);
  });
  if(DB.categories.some(c=>c.id===prev)) sel.value = prev;
}

/* ---------- gestione categorie / storie ---------- */
function totalStories(){
  return DB.categories.reduce((a,c)=>a+c.stories.length,0);
}
function renderCategories(){
  const wrap = document.getElementById('catList');
  wrap.innerHTML = '';
  document.getElementById('totalBadge').textContent = `${totalStories()} storie · ${DB.categories.length} categorie`;

  DB.categories.forEach(cat=>{
    const card = document.createElement('div');
    card.className = 'cat-card';

    const unusedCount = cat.stories.filter(s=>!s.used).length;

    card.innerHTML = `
      <div class="cat-head">
        <div class="cat-dot" style="background:${cat.color}"></div>
        <div class="name">${cat.emoji} ${cat.name}</div>
        <div class="count mono">uscite: ${cat.uscite||0} · riserva: ${unusedCount}</div>
        <button class="iconbtn editCatBtn" title="Modifica">✏️</button>
        <button class="iconbtn delCatBtn" title="Elimina">🗑️</button>
      </div>
      <div class="edit-form" style="display:none;">
        <input type="text" class="editName" value="${escapeAttr(cat.name)}" placeholder="Nome">
        <input type="text" class="editEmoji" value="${escapeAttr(cat.emoji)}" placeholder="Emoji" style="width:52px; text-align:center;">
        <input type="color" class="editColor" value="${cat.color}">
        <input type="text" class="editUscite mono" value="${cat.uscite||0}" placeholder="Uscite" style="width:64px;">
        <div class="row-actions">
          <button class="ghost small cancelEditCat">Annulla</button>
          <button class="ok small saveEditCat">Salva</button>
        </div>
      </div>
      <div class="cat-body">
        <ul class="story-list"></ul>
        <div class="add-story">
          <input type="text" class="newStoryInput" placeholder="Nuova storia per questa categoria…">
          <button class="small addStoryBtn">+ Aggiungi</button>
        </div>
      </div>
    `;

    const ul = card.querySelector('.story-list');
    cat.stories.forEach(story=>{
      const li = document.createElement('li');
      li.className = 'story-item' + (story.used ? ' used' : '');
      li.innerHTML = `
        <input type="checkbox" ${story.used?'checked':''}>
        <div class="txt">${escapeHtml(story.text)}</div>
        <button class="del">🗑️</button>
      `;
      li.querySelector('input[type=checkbox]').addEventListener('change', (e)=>{
        const wasUsed = story.used;
        story.used = e.target.checked;
        if(story.used && !wasUsed) cat.uscite = (cat.uscite||0)+1;
        if(!story.used && wasUsed) cat.uscite = Math.max(0,(cat.uscite||0)-1);
        save();
        renderCategories();
      });
      li.querySelector('.del').addEventListener('click', ()=>{
        if(!confirm('Eliminare questa storia dalla riserva?')) return;
        cat.stories = cat.stories.filter(s=>s.id!==story.id);
        save();
        renderCategories();
      });
      ul.appendChild(li);
    });

    card.querySelector('.addStoryBtn').addEventListener('click', ()=>{
      const inp = card.querySelector('.newStoryInput');
      const val = inp.value.trim();
      if(!val) return;
      cat.stories.push({id:cid(), text:val, used:false});
      inp.value='';
      save();
      renderCategories();
    });
    card.querySelector('.newStoryInput').addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){ card.querySelector('.addStoryBtn').click(); }
    });

    const form = card.querySelector('.edit-form');
    card.querySelector('.editCatBtn').addEventListener('click', ()=>{
      form.style.display = form.style.display==='none' ? 'flex' : 'none';
    });
    card.querySelector('.cancelEditCat').addEventListener('click', ()=>{
      form.style.display = 'none';
    });
    card.querySelector('.saveEditCat').addEventListener('click', ()=>{
      const newName = form.querySelector('.editName').value.trim() || cat.name;
      const newEmoji = form.querySelector('.editEmoji').value.trim() || cat.emoji;
      const newColor = form.querySelector('.editColor').value;
      const newUscite = parseInt(form.querySelector('.editUscite').value,10);
      cat.name = newName;
      cat.emoji = newEmoji;
      cat.color = newColor;
      cat.uscite = isNaN(newUscite) ? cat.uscite : newUscite;
      save();
      renderAll();
      toast('Categoria aggiornata');
    });
    card.querySelector('.delCatBtn').addEventListener('click', ()=>{
      if(!confirm(`Eliminare la categoria "${cat.name}" e tutte le sue storie?`)) return;
      DB.categories = DB.categories.filter(c=>c.id!==cat.id);
      save();
      renderAll();
      toast('Categoria eliminata');
    });

    wrap.appendChild(card);
  });
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeAttr(s){
  return escapeHtml(s).replace(/"/g,'&quot;');
}

document.getElementById('addCatBtn').addEventListener('click', ()=>{
  const name = prompt('Nome della nuova categoria:');
  if(!name) return;
  const emoji = prompt('Emoji (opzionale):', '✨') || '✨';
  const palette = ['#f5a623','#22d3ee','#4ade80','#e879f9','#fb7185','#818cf8','#facc15','#38bdf8'];
  const color = palette[DB.categories.length % palette.length];
  DB.categories.push({id:cid(), name:name.trim(), emoji:emoji.trim(), color, uscite:0, stories:[]});
  save();
  renderAll();
  toast('Categoria aggiunta');
});

/* ---------- export / import / reset ---------- */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ruota_backup.json';
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed.categories) throw new Error('formato non valido');
      DB = parsed;
      save();
      renderAll();
      toast('Backup importato ✓');
    }catch(err){
      alert('File non valido: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Ripristinare i dati di partenza? Le modifiche fatte finora verranno perse (esporta prima un backup se vuoi tenerle).')) return;
  DB = JSON.parse(JSON.stringify(SEED));
  save();
  renderAll();
  toast('Dati ripristinati');
});

/* ---------- render globale ---------- */
function renderAll(){
  renderWheel();
  renderSelect();
  renderCategories();
}
renderAll();

/* ---------- manifest fallback (self-sufficienza offline/file locale) ---------- */
(function installManifestFallback(){
  fetch('./manifest.webmanifest').catch(()=>{
    const manifest = {
      name:"La Ruota", short_name:"Ruota",
      start_url:"./index.html", display:"standalone",
      background_color:"#141225", theme_color:"#141225",
      icons:[]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  });
})();

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
